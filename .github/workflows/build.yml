name: 🏭 Build

on:
  push:
    branches:
    - 'fhnaseer/**'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BUILDCONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages/

jobs:
  build:
    name: 🏭 Build (AV diag cc=${{ matrix.covver }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        covver: ['18.9.0', '18.11.0']
        attempt: [1, 2, 3]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        submodules: true
    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites -NoNuGetCredProvider
        dotnet --info
      shell: pwsh
    - name: ⚙ Install node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        cache: yarn
        cache-dependency-path: src/nerdbank-gitversioning.npm/yarn.lock
    - name: ⚙️ Set pipeline variables based on source
      run: tools/variables/_define.ps1
      shell: pwsh
    - name: 🛠 build
      run: dotnet build -t:build -c ${{ env.BUILDCONFIGURATION }} /p:CodeCoverageVersion=${{ matrix.covver }} -warnAsError -warnNotAsError:NU1901,NU1902,NU1903,NU1904 /bl:"${{ runner.temp }}/_artifacts/build_logs/build.binlog"

    - name: 🔎 AV diag — environment
      shell: bash
      run: |
        set -x
        T="${TMPDIR:-/tmp}"
        echo "TMPDIR raw='${TMPDIR:-<unset>}'  effective='$T'"
        findmnt -T "$T" || true
        df -hT "$T" || true
        echo '--- /proc/mounts (tmp & mnt) ---'; grep -E ' /tmp | /mnt ' /proc/mounts || true
        free -h || true
        echo '--- swap ---'; swapon --show || cat /proc/swaps || true
        echo '--- cgroup mem ---'; cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || true
        nproc; uname -a
        echo '--- coverage package versions ---'
        echo "requested CodeCoverageVersion=${{ matrix.covver }}"
        find "$NUGET_PACKAGES" -maxdepth 2 -type d -iname '*codecoverage*' 2>/dev/null || true

    - name: 🧪 test WITH coverage (Linux forced) — repro loop
      shell: bash
      run: |
        set +e
        crashed=0
        for i in 1 2 3 4 5 6; do
          echo "==================== cc=${{ matrix.covver }} coverage test iteration $i ===================="
          pwsh tools/dotnet-test-cloud.ps1 -Configuration ${{ env.BUILDCONFIGURATION }} -Agent ${{ runner.os }}
          rc=$?
          echo "iteration $i exit code: $rc"
          if [ $rc -ne 0 ]; then echo "NON-ZERO (possible AV) on cc=${{ matrix.covver }} iteration $i"; crashed=1; break; fi
        done
        echo "REPRO_SUMMARY cc=${{ matrix.covver }} attempt=${{ matrix.attempt }} crashed=$crashed"
        exit 0
      timeout-minutes: 30

    - name: 🔎 AV diag — post-crash capture
      if: always()
      shell: bash
      run: |
        set -x
        A="$RUNNER_TEMP/_artifacts"
        T="${TMPDIR:-/tmp}"
        echo '--- leftover coverage buffer/data files in temp ---'
        ls -la "$T" 2>/dev/null | grep -Ei 'MS.CC|Coverage|\.(b|d|u)[0-9a-f]' || echo '(none matched)'
        echo '--- dmesg (traps/segfault/sig) ---'
        { dmesg 2>/dev/null || sudo dmesg 2>/dev/null; } | grep -Ei 'trap|segfault|sig=|protection|testhost|dotnet|core dump' | tail -60 || echo '(dmesg unavailable)'
        echo '--- collector logs: mismatch / abandon / unmap / AV ---'
        grep -RniE 'buffer size mismatch|abandon (previous|current) stream|munmap|Could not unmap|CreateUnmanagedStream|AccessViolation|SIGBUS|SIGSEGV' "$A" 2>/dev/null | head -120 || echo '(no matches)'
        echo '--- native crash reports ---'
        D="$A/av_diag"; mkdir -p "$D"
        find "$A" \( -iname '*crashreport*' -o -iname '*crashdump*' -o -iname '*.dmp' \) 2>/dev/null | tee /tmp/crashfiles.txt
        for f in $(grep -iE 'crashreport.*json$' /tmp/crashfiles.txt 2>/dev/null); do
          echo "== $f =="
          cp "$f" "$D/" 2>/dev/null || true
          echo '-- signal / process --'
          jq -r '{signal: (.payload.threads[]? | select(.crashed==true) | .signal), pid: .payload.process_info?.pid?}' "$f" 2>/dev/null | head -20 || true
          echo '-- crashing thread native frames (top 25) --'
          jq -r '.payload.threads[]? | select(.crashed==true) | .stack_frames[]? | [.native_address, .module_name, .method_name] | @tsv' "$f" 2>/dev/null | head -25 || true
          echo '-- raw grep fallback --'
          grep -Eio '"signal"[^,]*|"signal_name"[^,]*|libCoverageInstrumentation[^"]*|covrun[^"]*|"module_name":"[^"]*"' "$f" 2>/dev/null | sort | uniq -c | sort -rn | head -30 || true
        done
        echo '--- test_logs listing ---'
        find "$A/test_logs" -maxdepth 2 -type f 2>/dev/null | head -60 || true
        echo '--- drop large heap dumps to keep artifacts small (crashreport.json retained) ---'
        find "$A" -iname '*.dmp' -size +20M -delete 2>/dev/null || true

    - name: 📢 Publish artifacts
      uses: ./.github/actions/publish-artifacts
      if: cancelled() == false